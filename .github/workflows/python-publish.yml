name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:  # This allows manual triggering of the workflow

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git to use 'main' as default branch
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Build release distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

      # TestPyPI permanently refuses a filename it has already accepted, so a
      # manual run of this workflow -- where pyproject.toml still carries the
      # version of the last release -- always failed with "400 File already
      # exists" (#350). Build a second, separately named copy for TestPyPI using
      # a PEP 440 dev segment. The release-dists artifact above is untouched, so
      # what reaches real PyPI is still the exact version that was tagged.
      - name: Build dev distributions for TestPyPI
        run: |
          rm -rf dist/
          # Digits only (PEP 440 requires .devN), and the run number keeps two
          # manual runs on the same day from colliding with each other.
          DEV_SUFFIX=".dev$(date -u +%Y%m%d)${{ github.run_number }}"
          sed -i -E "s/^version = \"([^\"]+)\"$/version = \"\1${DEV_SUFFIX}\"/" pyproject.toml
          grep -m1 '^version' pyproject.toml
          uv build

      - name: Upload dev distributions
        uses: actions/upload-artifact@v7
        with:
          name: testpypi-dists
          path: dist/

  testpypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ucc/${{ github.event.release.tag_name }}

    steps:
      - name: Retrieve dev distributions
        uses: actions/download-artifact@v8
        with:
          name: testpypi-dists
          path: dist/

      - name: Publish dev distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Clean up distributions
        run: rm -rf dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: testpypi-publish # If statement guarantees we are on main and either in a release or manual dispatch event.
    if: (github.event.release.target_commitish == 'main' && github.event_name == 'release') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/ucc/${{ github.event.release.tag_name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Clean up distributions
        run: rm -rf dist/
